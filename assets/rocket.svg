<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Sleek Tech Gradient -->
    <linearGradient id="rocketBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="rocketWingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Thrust Fire Gradient -->
    <linearGradient id="thrustFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="80%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Aura Glow Filter -->
    <filter id="rocketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Orbit Ring -->
  <circle cx="60" cy="60" r="48" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.35" />

  <!-- Dynamic Exhaust Flame Particles -->
  <g transform="translate(30, 72) rotate(45)">
    <!-- Core Flame -->
    <path d="M0,0 C-10,25 0,42 0,55 C0,42 10,25 0,0 Z" fill="url(#thrustFlame)" filter="url(#rocketGlow)" />
    <!-- Inner High Heat Core -->
    <path d="M0,5 C-4,18 0,30 0,38 C0,30 4,18 0,5 Z" fill="#ffffff" />
  </g>

  <!-- Sleek Aerodynamic Rocket Body (Tilted at 45deg) -->
  <g transform="translate(62, 54) rotate(45)">
    <!-- Left Fin -->
    <path d="M-12,18 L-30,42 L-10,36 Z" fill="url(#rocketWingGrad)" />
    <!-- Right Fin -->
    <path d="M12,18 L30,42 L10,36 Z" fill="url(#rocketWingGrad)" />
    
    <!-- Fuselage -->
    <path d="M0,-48 C16,-20 18,18 12,38 L-12,38 C-18,18 -16,-20 0,-48 Z" fill="url(#rocketBodyGrad)" stroke="#4338ca" stroke-width="1.5" />
    
    <!-- Nosecone Cap -->
    <path d="M0,-48 C8,-32 10,-24 0,-18 C-10,-24 -8,-32 0,-48 Z" fill="url(#rocketWingGrad)" />
    
    <!-- Cockpit Porthole Window -->
    <circle cx="0" cy="-6" r="7.5" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <circle cx="-2" cy="-8" r="2.5" fill="#ffffff" opacity="0.8" />

    <!-- Exhaust Nozzle Base -->
    <rect x="-8" y="38" width="16" height="5" rx="2" fill="#312e81" />
  </g>

  <!-- Cosmic Stars / Sparkles -->
  <circle cx="98" cy="22" r="2.5" fill="#38bdf8" />
  <circle cx="22" cy="38" r="1.8" fill="#ec4899" />
  <circle cx="94" cy="94" r="2" fill="#fbbf24" />
</svg>
