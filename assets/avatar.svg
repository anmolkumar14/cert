<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120" fill="none">
  <!-- Clean Photo Frame Background -->
  <rect width="100" height="120" fill="#f8fafc" />
  
  <!-- Subtle Gradient Background -->
  <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
    <stop offset="0%" stop-color="#f1f5f9" />
    <stop offset="100%" stop-color="#e2e8f0" />
  </radialGradient>
  <rect width="100" height="120" fill="url(#bgGrad)" />

  <!-- Person Head / Hair / Skin -->
  <!-- Hair -->
  <path d="M30 46 C30 26 70 26 70 46 C66 30 34 30 30 46 Z" fill="#6d4c41" />
  <circle cx="50" cy="46" r="19" fill="#fbc02d" opacity="0.15" />
  <ellipse cx="50" cy="46" rx="16" ry="19" fill="#e0a96d" />

  <!-- Neck -->
  <rect x="44" y="60" width="12" height="12" fill="#d0985c" />

  <!-- White Shirt Collar & Tie -->
  <polygon points="50,78 40,68 60,68" fill="#ffffff" />
  <polygon points="48,72 52,72 51,92 49,92" fill="#0284c7" />

  <!-- Suit Jacket (Blue) -->
  <path d="M15 120 L22 80 L38 88 L50 80 L62 88 L78 80 L85 120 Z" fill="#1e40af" />
  <!-- Lapels -->
  <path d="M22 80 L44 96 L40 68 Z" fill="#1e3a8a" />
  <path d="M78 80 L56 96 L60 68 Z" fill="#1e3a8a" />
</svg>
