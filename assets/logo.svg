<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Outer Circular Ring -->
  <circle cx="80" cy="72" r="50" stroke="#005a9c" stroke-width="4.5" fill="#ffffff" />
  <circle cx="80" cy="72" r="44" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 2" />

  <!-- Central Hexagonal / Emblem Elements (IIM Indore Crest Style) -->
  <g transform="translate(80, 72)">
    <!-- Interlocking Hexagonal Geometry -->
    <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" stroke="#005a9c" stroke-width="3" fill="#f0f9ff" />
    <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11" fill="#005a9c" opacity="0.9" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
    <circle cx="0" cy="0" r="4.5" fill="#005a9c" />

    <!-- Radiant Nodes -->
    <line x1="0" y1="-32" x2="0" y2="-44" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="-16" x2="38" y2="-22" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="28" y1="16" x2="38" y2="22" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="32" x2="0" y2="44" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-28" y1="16" x2="-38" y2="22" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-28" y1="-16" x2="-38" y2="-22" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Accreditation / Institutional Typography Underneath -->
  <text x="80" y="136" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#005a9c" letter-spacing="1">IIM INDORE</text>
  <text x="80" y="148" text-anchor="middle" font-family="'Inter', sans-serif" font-size="7" font-weight="600" fill="#64748b" letter-spacing="0.5">ACCREDITED &bull; EQUIS</text>
</svg>
