<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="gradRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Tech Nodes -->
  <circle cx="60" cy="55" r="44" stroke="url(#gradPrimary)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.85" />
  <circle cx="60" cy="55" r="38" stroke="url(#gradPrimary)" stroke-width="1.5" opacity="0.4" />

  <!-- Diploma Shield / Crest -->
  <path d="M60 22 L86 34 V56 C86 73 75 87 60 93 C45 87 34 73 34 56 V34 Z" 
        fill="url(#gradPrimary)" fill-opacity="0.15" stroke="url(#gradPrimary)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Inner Laurels / Gold Stars -->
  <circle cx="60" cy="48" r="16" fill="url(#gradGold)" filter="url(#glow)" opacity="0.95" />
  <path d="M60 38 L62.5 45 H70 L64 49.5 L66.5 56.5 L60 52 L53.5 56.5 L56 49.5 L50 45 H57.5 Z" fill="#ffffff" />

  <!-- Ribbons at Bottom -->
  <path d="M52 64 L46 98 L56 90 L60 98 L60 64 Z" fill="url(#gradRibbon)" opacity="0.9" />
  <path d="M68 64 L74 98 L64 90 L60 98 L60 64 Z" fill="url(#gradRibbon)" opacity="0.75" />
  
  <!-- Subtle Sparkles -->
  <circle cx="28" cy="30" r="1.8" fill="#14b8a6" />
  <circle cx="92" cy="30" r="1.8" fill="#6366f1" />
  <circle cx="60" cy="14" r="2.2" fill="#fbbf24" />
</svg>
